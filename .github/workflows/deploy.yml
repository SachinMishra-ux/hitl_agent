name: HITL Agent — Build & Deploy to AWS ECR / EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME || 'hitl-agent' }}

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1: Continuous Integration (Build & Push Docker Image to ECR)
  # ────────────────────────────────────────────────────────────────────────────
  Continuous-Integration:
    name: Build & Push Image to Amazon ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Docker Image to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building Docker image ${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}..."
          docker build -t ${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG} -t ${REGISTRY}/${ECR_REPOSITORY}:latest .
          echo "Pushing image to ECR..."
          docker push ${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}
          docker push ${REGISTRY}/${ECR_REPOSITORY}:latest

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2: Continuous Deployment (Pull & Run on EC2)
  # ────────────────────────────────────────────────────────────────────────────
  Continuous-Deployment:
    name: Pull & Deploy on AWS EC2
    needs: Continuous-Integration
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pull Latest Docker Image & Restart Application
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "Pulling latest image ${REGISTRY}/${ECR_REPOSITORY}:latest..."
          docker pull ${REGISTRY}/${ECR_REPOSITORY}:latest

          echo "Stopping previous container if running..."
          docker stop hitl-agent-service || true
          docker rm hitl-agent-service || true

          echo "Ensuring persistent storage directory exists..."
          mkdir -p $(pwd)/data

          echo "Starting newly deployed container..."
          docker run -d \
            --name hitl-agent-service \
            --restart unless-stopped \
            -p 8000:8000 \
            --env-file .env \
            -v $(pwd)/data:/app/data \
            ${REGISTRY}/${ECR_REPOSITORY}:latest

          echo "Cleaning up dangling images..."
          docker image prune -f

      - name: Verify Service Health
        run: |
          sleep 5
          curl --fail http://localhost:8000/api/health || (docker logs hitl-agent-service && exit 1)
