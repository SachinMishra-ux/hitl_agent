version: '3.8'

services:
  hitl-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${HITL_AGENT_IMAGE:-hitl-agent:latest}
    container_name: hitl-agent-service
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persistent volume for SQLite checkpoints and post metadata
      - ./data:/app/data:rw
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
